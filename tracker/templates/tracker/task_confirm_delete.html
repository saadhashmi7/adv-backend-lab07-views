{% extends "library/base.html" %}
{% block title %}Delete {{ task.title }}{% endblock %}
{% block content %}
<h1>Delete task "{{ task.title }}"?</h1>
<p>This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  <a href="{% url 'tracker:task-detail' task.pk %}">Cancel</a>
</form>
{% endblock %}
