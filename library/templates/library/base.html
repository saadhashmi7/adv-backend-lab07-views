<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Campus Library{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; }
    .msg { padding: .5rem 1rem; background: #e8f5e9; border-left: 4px solid #2e7d32; margin: 1rem 0; }
    .msg.error { background: #fdecea; border-color: #c62828; }
    .errors { color: #c62828; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'library:home' %}">Home</a>
    <a href="{% url 'library:book-list' %}">Books</a>
    <a href="{% url 'library:book-add' %}">Add book</a>
  </nav>
  <hr>
  {% for message in messages %}
    <div class="msg {{ message.tags }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
