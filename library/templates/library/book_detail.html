{% extends "library/base.html" %}
{% block title %}{{ book.title }}{% endblock %}
{% block content %}
<h1>{{ book.title }}</h1>
<p>by {{ book.author }} ({{ book.published_year }})</p>
<p>Status: <strong>{{ book.get_status_display }}</strong></p>
<p><a href="{% url 'library:book-list' %}">&larr; Back to list</a></p>
{% endblock %}
