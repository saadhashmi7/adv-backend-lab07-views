{% extends "library/base.html" %}
{% block title %}Task form{% endblock %}
{% block content %}
<h1>{% if object %}Edit "{{ object.title }}"{% else %}New task{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
  <a href="{% url 'tracker:task-list' %}">Cancel</a>
</form>
{% endblock %}
